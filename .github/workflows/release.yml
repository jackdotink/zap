name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
    - uses: ncipollo/release-action@v1
      id: create_release
      with:
        name: Release ${{ github.ref }}
        draft: true
        tag: ${{ github.ref }}

  build:
    needs: ["create-release"]
    name: Build
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
        - name: "Windows x86_64"
          os: windows-latest
          target: x86_64-pc-windows-msvc
          label: windows-x86_64
        
        - name: "Linux x86_64"
          os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
          label: linux-x86_64
        
        - name: "MacOS x86_64"
          os: macos-latest
          target: x86_64-apple-darwin
          label: macos-x86_64
        
        - name: "MacOS aarch64"
          os: macos-latest
          target: aarch64-apple-darwin
          label: macos-aarch64
    
    steps:
    - uses: actions/checkout@v4

    - name: Get Version From Tag
      shell: bash
      run: echo "PROJECT_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache Rust
      uses: swatinem/rust-cache@v2
    
    - name: Build
      run: cargo build --locked --verbose --release --target ${{ matrix.target }}
    
    - name: Make Artifact
      shell: bash
      run: |
        mkdir release
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          7z a release.zip target/${{ matrix.target }}/release/zap.exe
        else
          zip -r release.zip target/${{ matrix.target }}/release/zap release/zap
        fi
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zap-${{ env.PROJECT_VERSION }}-${{ matrix.label }}.zip
        path: release.zip
    
    - name: Upload to Release
      uses: shogo82148/actions-upload-release-asset@v1
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: release.zip
        asset_name: zap-${{ env.PROJECT_VERSION }}-${{ matrix.label }}.zip
        asset_content_type: application/octet-stream
    
  