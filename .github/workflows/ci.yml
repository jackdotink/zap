name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: "Windows x86_64"
          os: windows-latest
          target: x86_64-pc-windows-msvc
          artifact: zap-${{ github.sha }}-windows-x86_64
        
        - name: "Linux x86_64"
          os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
          artifact: zap-${{ github.sha }}-linux-x86_64
        
        - name: "MacOS x86_64"
          os: macos-latest
          target: x86_64-apple-darwin
          artifact: zap-${{ github.sha }}-macos-x86_64
        
        - name: "MacOS aarch64"
          os: macos-latest
          target: aarch64-apple-darwin
          artifact: zap-${{ github.sha }}-macos-aarch64

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache Rust
      uses: swatinem/rust-cache@v2

    - name: Build
      run: cargo build --locked --verbose --release --target ${{ matrix.target }}

    - name: Make Artifact
      shell: bash
      run: |
        mkdir release
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          cp target/${{ matrix.target }}/release/zap.exe release/zap.exe
        else
          cp target/${{ matrix.target }}/release/zap release/zap
        fi
        zip -r release.zip release
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: release.zip
  
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache Rust
      uses: swatinem/rust-cache@v2

    - name: Rustfmt
      run: cargo fmt -- --check

    - name: Clippy
      run: cargo clippy